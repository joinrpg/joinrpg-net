name: Build and publish

on:
  pull_request:
  merge_group:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v**
  workflow_dispatch:

env:
  APP_PROJECT: ./src/JoinRpg.Portal/JoinRpg.Portal.csproj
  MIGRATOR_PROJECT: ./src/Joinrpg.Dal.Migrate/Joinrpg.Dal.Migrate.csproj
  IDPORTAL_PROJECT: ./src/JoinRpg.IdPortal/JoinRpg.IdPortal/JoinRpg.IdPortal.csproj
  COMPONENTBOOK_PROJECT: ./src/Common/WebComponents/JoinRpg.Common.WebComponentBook.Portal/JoinRpg.Common.WebComponentBook.Portal.csproj

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Format, тесты и проверка publish на PR идут параллельно. Пуш образов на master ждёт format и тесты,
# чтобы latest в registry не обновлялся сломанной сборкой. Общие шаги переиспользуются YAML-якорями.
jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - &setup-dotnet
      name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "Directory.Packages.props"

    - &restore
      name: Restore
      run: dotnet restore

    - name: Format
      run: dotnet format --no-restore --verify-no-changes --severity warn

  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
    - &checkout-full
      name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch the whole repo history

    # TODO: Make GitHub Action from this script
    - &git-version
      name: Git Version  # Fills env.CALCULATED_VERSION and env.CALCULATED_VERSION_IS_RELEASE
      id: version
      run:  iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
      shell: pwsh
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}

    - *setup-dotnet
    - *restore

    - name: Build portal
      run: dotnet build --no-restore -c Release  --property:Version=${{ env.CALCULATED_VERSION }}

    # NuGet-пакеты публикуются вручную (nuget-publish.yml), поэтому ошибку упаковки ловим здесь, а не при публикации.
    # Сравнение с последней версией на nuget.org — docs/nuget-packages.md#ломающее-изменение.
    - name: Pack NuGet packages
      shell: pwsh
      run: |
        # CDN nuget.org изредка отвечает ошибкой — повторяем.
        # 404 повтором не лечится: пакет ещё не публиковался.
        function Invoke-NuGet([string] $uri, [string] $outFile) {
          for ($attempt = 1; ; $attempt++) {
            try {
              if ($outFile) { return Invoke-WebRequest $uri -OutFile $outFile }
              return Invoke-RestMethod $uri
            }
            catch {
              if ($_.Exception.Response.StatusCode -eq 404 -or $attempt -ge 3) { throw }
              Write-Host "::warning::$uri — $($_.Exception.Message), попытка $attempt"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
        }

        $projects = Get-ChildItem src -Recurse -Filter *.csproj |
          Where-Object { (Get-Content $_.FullName -Raw).Contains('<IsPackable>true</IsPackable>') }
        foreach ($project in $projects) {
          $baseline = @()
          $id = $project.BaseName.ToLowerInvariant()
          try {
            $version = (Invoke-NuGet "https://api.nuget.org/v3-flatcontainer/$id/index.json").versions |
              Where-Object { -not $_.Contains('-') } |
              Sort-Object { [version] $_ } |
              Select-Object -Last 1
            if ($version) {
              # Свойство с версией не годится: SDK качает базовый пакет при restore, а --no-build пропускает restore.
              $nupkg = Join-Path $env:RUNNER_TEMP "$id.$version.nupkg"
              Invoke-NuGet "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" $nupkg
              $baseline = @("-p:PackageValidationBaselinePath=$nupkg")
            }
          }
          catch {
            # 404 — пакет ещё не публиковался, сравнивать не с чем.
            if ($_.Exception.Response.StatusCode -ne 404) { throw }
          }
          dotnet pack $project.FullName --no-build -c Release -p:Version=${{ env.CALCULATED_VERSION }} @baseline
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }

    - name: Test
      run: dotnet test -c Release --no-build --logger trx --results-directory ./TestResults

    - name: Save test results to artifacts
      uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        # Артефакты в GitHub Actions не привязаны к номеру попытки, поэтому при перезапуске
        # только упавших джоб report подхватил бы trx от предыдущей попытки (issue #5188).
        name: test-results-${{ github.run_attempt }}
        path: TestResults

  # Изменился публичный API пакета (PublicAPI.*.txt) — в том же PR должен измениться его CHANGELOG.md.
  nuget-changelog:
    name: NuGet changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - *checkout-full

    - name: Check CHANGELOG for public API changes
      shell: pwsh
      run: |
        $changed = git diff --name-only "origin/${{ github.base_ref }}...HEAD"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $missing = $changed |
          Where-Object { $_.EndsWith('/PublicAPI.Shipped.txt') -or $_.EndsWith('/PublicAPI.Unshipped.txt') } |
          ForEach-Object { Split-Path -Parent $_ } |
          Sort-Object -Unique |
          Where-Object { $changed -notcontains "$_/CHANGELOG.md" }
        foreach ($dir in $missing) {
          Write-Host "::error file=$dir/CHANGELOG.md::Публичный API пакета изменился, а CHANGELOG.md — нет (docs/nuget-packages.md#changelog)"
        }
        if ($missing) { exit 1 }

  verify-publish:
    name: Verify publish
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    steps:
    - *checkout-full
    - *git-version
    - *setup-dotnet
    - *restore

    - name: Verify publish
      run: |
        dotnet publish --no-restore --os linux --arch x64 -c Release ${APP_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}
        dotnet publish --no-restore --os linux --arch x64 -c Release ${MIGRATOR_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}
        dotnet publish --no-restore --os linux --arch x64 -c Release ${IDPORTAL_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}
        dotnet publish --no-restore --os linux --arch x64 -c Release ${COMPONENTBOOK_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

  # Образы публикуются только с master и тегов: ручной запуск с другой ветки не должен перезаписать latest.
  # PR и merge queue сюда тоже не попадают — их ref не master и не тег.
  # В registry логинимся секретами, GITHUB_TOKEN нужен только на чтение.
  # Публикации с master идут по очереди: параллельные пуши одних и тех же слоёв в Selectel CR ломали
  # pull в кластере (#5906). GitHub держит в очереди одну ожидающую джобу и отменяет промежуточные —
  # это нормально, их коммиты войдут в следующую сборку. Очередь выстраивается по моменту, когда
  # закончились format и test, а не по порядку коммитов, так что latest от более старого коммита всё ещё
  # возможен, если его тесты закончились позже.
  # Теги в общую очередь не попадают: публикацию релиза отменять нельзя.
  publish:
    name: Publish images
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    needs: [format, test]
    concurrency:
      group: ${{ github.ref == 'refs/heads/master' && 'publish-master' || format('publish-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - *checkout-full
    - *git-version
    - *setup-dotnet
    - *restore

    - name: Log in to Selectel Container Registry
      id: login-cr-selectel
      uses: docker/login-action@v4
      with:
        registry: cr.selcloud.ru
        username: ${{ secrets.SELECTEL_CR_USERNAME }}
        password: ${{ secrets.SELECTEL_CR_PASSWORD }}

    # TODO: убрать, когда деплой переедет на Selectel
    - name: Log in to Yandex Container Registry
      id: login-cr
      uses: yc-actions/yc-cr-login@v3
      with:
        yc-sa-json-credentials: ${{ secrets.YANDEX_CR_SA_KEY_JSON }}

    # SDK собирает образы в локальный docker, а пушит docker push: при прямом пуше из SDK
    # Selectel возвращает в Location внутренний адрес (*.craas-service.svc) и загрузка слоёв падает.
    - name: Build portal image
      run: dotnet publish --no-restore --os linux --arch x64 -c Release /t:PublishContainer ${APP_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    - name: Build migrator image
      run: dotnet publish --no-restore --os linux --arch x64 -c Release /t:PublishContainer ${MIGRATOR_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    - name: Build id portal image
      run: dotnet publish --no-restore --os linux --arch x64 -c Release /t:PublishContainer ${IDPORTAL_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    - name: Build component book image
      run: dotnet publish --no-restore --os linux --arch x64 -c Release /t:PublishContainer ${COMPONENTBOOK_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    - name: Push images to Selectel
      env:
        TARGET_PREFIX: cr.selcloud.ru/joinrpg
        IMAGE_NAMES: joinrpg-portal joinrpg-dal-migrate joinrpg-idportal joinrpg-componentbook
      run: |
        set -euo pipefail
        for name in ${IMAGE_NAMES}; do
          for tag in latest ${{ env.CALCULATED_VERSION }}; do
            docker tag joinrpg/${name}:${tag} ${TARGET_PREFIX}/${name}:${tag}
            docker push --quiet ${TARGET_PREFIX}/${name}:${tag}
          done
        done

    # deploy_dev_auto берёт отсюда версию и деплоит её, а не latest, который мог уже уйти вперёд (#5906).
    - name: Save image version
      run: echo "${{ env.CALCULATED_VERSION }}" > image-version.txt

    - name: Upload image version
      uses: actions/upload-artifact@v7
      with:
        name: image-version
        path: image-version.txt
        # Артефакты общие для всех попыток прогона: без overwrite повторный запуск publish упадёт с 409.
        overwrite: true

    # TODO: убрать, когда деплой переедет на Selectel
    - name: Push images to Yandex
      env:
        TARGET_PREFIX: cr.yandex/crp3fr717nr1rn78qeij
        IMAGE_NAMES: joinrpg-portal joinrpg-dal-migrate joinrpg-idportal joinrpg-componentbook
      run: |
        set -euo pipefail
        for name in ${IMAGE_NAMES}; do
          for tag in latest ${{ env.CALCULATED_VERSION }}; do
            docker tag joinrpg/${name}:${tag} ${TARGET_PREFIX}/${name}:${tag}
            docker push --quiet ${TARGET_PREFIX}/${name}:${tag}
          done
        done

  # Обязательная проверка в branch protection называется "Build and publish" — это имя этого джоба.
  # Он собирает результаты остальных; skipped (verify-publish на master, publish на PR) не считается ошибкой.
  # Отменённый publish — тоже не ошибка: так очередь пропускает промежуточные коммиты master (#5906).
  # Ручная отмена publish поэтому тоже оставит эту проверку зелёной. Сам прогон при этом завершается
  # как cancelled, и deploy_dev_auto для него ничего не деплоит.
  build:
    name: Build and publish
    needs: [format, test, verify-publish, publish]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Check results
      if: contains(needs.*.result, 'failure') || needs.format.result == 'cancelled' || needs.test.result == 'cancelled' || needs.verify-publish.result == 'cancelled'
      run: exit 1

  report:
    runs-on: ubuntu-24.04
    needs: test
    if: always()
    steps:
      - uses: dorny/test-reporter@v3.2.0
        with:
          artifact: test-results-${{ github.run_attempt }} # artifact name, см. issue #5188
          name: Unit tests                  # Name of the check run which will be created
          path: '*.trx'                     # Path to test results (inside artifact .zip)
          reporter: dotnet-trx              # Format of test results
