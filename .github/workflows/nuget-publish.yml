name: Publish NuGet packages

on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish-nuget:
    name: Pack and publish ${{ matrix.project }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # 🔐 Для trusted publishing через OIDC
    strategy:
      matrix:
        project:
          - JoinRpg.Common.WebInfrastructure
          - JoinRpg.Common.PrimitiveTypes
          - JoinRpg.Common.PrimitiveTypes.SourceGenerator
          - JoinRpg.Common.KogdaIgraClient
          - JoinRpg.Common.WebComponents
          - JoinRpg.Common.EntityFrameworkCore
          # Добавить новые проекты сюда:
          # - SomeOtherProject.csproj

    steps:
      - name: NuGet Login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: leotsarev
          
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Version
        id: version
        run: iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Locate project
        id: locate-project
        run: echo "PROJECT_FILENAME=$(dotnet sln list | grep ${{ matrix.project }}.csproj)" >> $GITHUB_OUTPUT 

      - name: Restore
        run: dotnet restore ${{ steps.locate-project.outputs.PROJECT_FILENAME }}

      - name: Pack
        run: >-
          dotnet pack  ${{ steps.locate-project.outputs.PROJECT_FILENAME }}
          --no-restore
          -c Release
          -p:Version=${{ env.CALCULATED_VERSION }}
      
      - name: NuGet push
        run: dotnet nuget push artifacts/package/release/${{ matrix.project }}.${{ env.CALCULATED_VERSION }}.nupkg --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json

  # После публикации — PR со штампом версии в CHANGELOG пакетов (docs/nuget-packages.md#после-публикации).
  # Только с master и только если опубликовались все пакеты: версия одна на всех.
  changelog-pr:
    name: CHANGELOG PR
    needs: publish-nuget
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Git Version
        run: iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}

      - name: Stamp CHANGELOG and open PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.CALCULATED_VERSION }}
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Пока публиковали, master мог уйти вперёд: штамп кладём поверх свежего master.
          git checkout --quiet origin/master
          ./scripts/Stamp-Changelog.ps1 -Version $env:VERSION -PublishedRef $env:PUBLISHED_SHA
          if (-not (git status --porcelain)) { Write-Host 'Менять нечего'; exit 0 }

          # Ветка принадлежит боту и названа по версии: при повторном запуске её можно перезаписать.
          $branch = "nuget-release/$env:VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create $branch
          git commit --all --quiet --message "docs(NuGet): CHANGELOG — версия $env:VERSION опубликована"
          git push --quiet --force origin $branch

          $PSNativeCommandUseErrorActionPreference = $false
          gh pr view $branch --json url 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'PR уже открыт'; exit 0 }
          $PSNativeCommandUseErrorActionPreference = $true

          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @"
          Пакеты $env:VERSION опубликованы на nuget.org с коммита $env:PUBLISHED_SHA ([прогон]($run)). Записи «Не выпущено» из CHANGELOG этого коммита перенесены в раздел версии. Записи, исправленные или удалённые в master после публикации, — в предупреждениях прогона, их надо поправить руками.

          **CI на этом PR сам не запустится**: PR открыт встроенным токеном GitHub Actions, а на его события workflow не запускаются. Закрой PR и открой заново — проверки запустятся, после этого PR можно вливать.

          🤖 Создан workflow «Publish NuGet packages»
          "@
          gh pr create --base master --head $branch --title "docs(NuGet): CHANGELOG — версия $env:VERSION опубликована" --body $body
