name: Deploy
on:
  workflow_call:
    inputs:
      deployVersion:
        required: true
        type: string
      environment_url:
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment_url }}
    name: deploy
    env:
      NAMESPACE: joinrpg-${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN нужен только для checkout: в registry и кластер ходим секретами.
    permissions:
      contents: read
    steps:
      - name: Log in to Selectel Container Registry
        id: login-cr-selectel
        uses: joinrpg/deploy-actions/selectel-cr-login@v1
        with:
          # TODO: перенести username из secrets в vars (конвенция deploy-actions)
          username: ${{ secrets.SELECTEL_CR_USERNAME }}
          password: ${{ secrets.SELECTEL_CR_PASSWORD }}

      - name: Resolve image digests
        id: check_existence
        uses: joinrpg/deploy-actions/resolve-image-digests@v1
        with:
          version: ${{ inputs.deployVersion }}
          images: |
            joinrpg-portal=joinrpg/joinrpg-portal
            joinrpg-dal-migrate=joinrpg/joinrpg-dal-migrate
            joinrpg-idportal=joinrpg/joinrpg-idportal
            joinrpg-componentbook=joinrpg/joinrpg-componentbook

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup kubectl context
        uses: joinrpg/deploy-actions/setup-kubectl-context@v1
        with:
          k8s-url: ${{ vars.SELECTEL_K8S_SERVER }}
          # YAML объекта Secret сервис-аккаунта: kubectl -n kube-system get secret <sa>-token -o yaml
          deploy-sa-secret: ${{ secrets.SELECTEL_DEPLOY_SA_SECRET }}

      - name: Generate environment manifests
        uses: joinrpg/deploy-actions/render-deploy-manifests@v1
        with:
          overlay-path: ./manifests/${{ inputs.environment }}
          secret-name: joinrpg-main
          secrets-json: ${{ toJSON(secrets) }}
          images-yaml: ${{ steps.check_existence.outputs.images-yaml }}

      - name: Apply DB migrations
        uses: joinrpg/deploy-actions/run-db-migrations@v1
        with:
          namespace: ${{ env.NAMESPACE }}
          job-name: joinrpg-dal-migrate
          secret-glob: ./kustomize_output/v1_secret_joinrpg-main-*
          migration-manifest: ./kustomize_output/batch_v1_job_joinrpg-dal-migrate.yaml

      - name: Deploy to k8s
        uses: joinrpg/deploy-actions/apply-with-prune@v1
        with:
          namespace: ${{ env.NAMESPACE }}
          rollout-deployments: |
            joinrpg-portal
            joinrpg-idportal
            joinrpg-componentbook
