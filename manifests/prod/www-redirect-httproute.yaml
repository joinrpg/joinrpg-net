# www.joinrpg.ru → joinrpg.ru. Замена аннотации nginx.ingress.kubernetes.io/from-to-www-redirect,
# которая была на Ingress joinrpg-portal: в Gateway API хосты задаются на весь маршрут,
# поэтому редирект — отдельный HTTPRoute с фильтром RequestRedirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joinrpg-portal-www-redirect
spec:
  hostnames:
    - www.joinrpg.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: joinrpg.ru
            statusCode: 301
