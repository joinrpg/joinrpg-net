resources:
  - ../base

namespace: joinrpg-dev

commonLabels:
  managed-by-kustomize-dev: "true" #Careful. Contains name of the environment, used for kubectl apply --prune

configMapGenerator:
  - name: joinrpg-configmap
    envs: # now using envs to create a configmap with envvars as keys inside
      - .env

patchesJson6902:
  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      version: v1
      name: joinrpg-portal
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: dev.joinrpg.ru

  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      version: v1
      name: joinrpg-idportal
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: devid.joinrpg.ru

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: joinrpg-portal
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 300m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: joinrpg-portal
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
        
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: joinrpg-idportal
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  - target:
      kind: HTTPRoute
      group: gateway.networking.k8s.io
      version: v1
      name: joinrpg-componentbook
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: dev-components.joinrpg.ru

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: joinrpg-componentbook
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0