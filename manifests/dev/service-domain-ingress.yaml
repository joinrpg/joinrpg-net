# Служебные домены dev-окружения на время восстановления после потери БД (DRP, #5459),
# по образцу prod (#5474): Portal и IdPortal dev доступны здесь помимо основных хостов.
# Боевые маршруты (joinrpg-portal, joinrpg-idportal) не трогаем.
# Чтобы убрать — удалить этот файл из resources в kustomization.yaml: деплой удалит
# HTTPRoute прунингом по метке managed-by-kustomize-dev.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joinrpg-portal-service-domain
spec:
  hostnames:
    - dev.joinrpg.tsarevs.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: joinrpg-portal
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: joinrpg-idportal-service-domain
spec:
  hostnames:
    - dev.id.joinrpg.tsarevs.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: joinrpg-idportal
          port: 80
